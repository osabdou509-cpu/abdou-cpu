name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip *.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./game-turbo-fps-nov-8-2026-6-05-29-am

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./game-turbo-fps-nov-8-2026-6-05-29-am

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: game-turbo-fps-nov-8-2026-6-05-29-am/app/build/outputs/apk/debug/*.apk
